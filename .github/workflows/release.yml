name: Release font

# Tag format: <package>-v<version>, e.g. jeongdok-v0.1.0
# This workflow builds every asset, attaches the e-reader / desktop zips to the GitHub Release,
# and uploads the web fonts (dist/web/static) to https://cdn.sharosoo.com/fonts/<package>/v<version>/.
on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Resolve package from tag
        run: echo "PKG=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_ENV"
      - name: Install
        run: |
          uv sync --frozen
          uv run scripts/fetch_tools.py
      - name: Build
        run: uv run scripts/build.py "$PKG"
      - name: QA
        run: uv run scripts/qa.py "$PKG"
      - name: Upload web fonts to cdn.sharosoo.com
        env:
          SHAROSOO_CDN_TOKEN: ${{ secrets.SHAROSOO_CDN_TOKEN }}
        run: |
          curl -fsSL https://cdn.sharosoo.com/tools/sharosoo-cdn/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          sharosoo-cdn put "packages/$PKG/dist/web/static" \
            --prefix "fonts/$PKG/v${GITHUB_REF_NAME##*-v}" \
            --cache-control "public, max-age=31536000, immutable"
      - name: Package
        run: uv run scripts/release.py "$PKG"
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/${{ env.PKG }}/dist/release/*.zip
            packages/${{ env.PKG }}/dist/release/SHA256SUMS
          body_path: packages/${{ env.PKG }}/dist/release/NOTES.md
