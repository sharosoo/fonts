[project]
name = "sharosoo-fonts"
version = "0.1.0"
description = "Build pipeline for the sharosoo/fonts monorepo (font grafting, Nerd Font patching, Kobo / CrossPoint / web packaging)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fonttools[woff]>=4.50",
    "skia-pathops>=0.8",
    "freetype-py>=2.4",
    "font-line>=0.5",
    "opentype-sanitizer>=9",
    "pillow>=10",
    "numpy>=1.26",
]

[tool.uv]
package = false   # scripts, not an installable package
